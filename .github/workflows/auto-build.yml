name: 同步上游并构建镜像

on:
  schedule:
    # 每 6 小时检查一次上游 Release（ Actions 定时任务可能有十几分钟延迟，正常）
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "填 true 强制重建（跳过版本对比）"
        required: false
        default: "false"

permissions:
  contents: write   # 回写 UPSTREAM_VERSION 用
  packages: write   # 推送 GHCR 镜像用

env:
  UPSTREAM_REPO: zako-li/miaomiaowux

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 查询上游最新面板 tag
        id: upstream
        run: |
          tag=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=100" \
            | jq -r '.[].tag_name' | grep -E '^(mmwx|mmwx-v.*)$' | head -n1)
          if [ -z "$tag" ]; then echo "没查到上游 release" >&2; exit 1; fi
          echo "最新上游 tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 与上次构建记录对比
        id: diff
        run: |
          last=$(cat UPSTREAM_VERSION 2>/dev/null || echo "")
          echo "上次构建: ${last:-无}"
          if [ "$last" = "${{ steps.upstream.outputs.tag }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "版本没变，跳过构建"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 小写化镜像名（GHCR 要求）
        if: steps.diff.outputs.changed == 'true'
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "IMAGE_NAME=ghcr.io/${owner}/mmwx" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
        if: steps.diff.outputs.changed == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.diff.outputs.changed == 'true'

      - uses: docker/login-action@v3
        if: steps.diff.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        if: steps.diff.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MMWX_TAG=${{ steps.upstream.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.upstream.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 记录本次构建的上游版本
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "${{ steps.upstream.outputs.tag }}" > UPSTREAM_VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add UPSTREAM_VERSION
          git commit -m "chore: bump upstream to ${{ steps.upstream.outputs.tag }}"
          git push
